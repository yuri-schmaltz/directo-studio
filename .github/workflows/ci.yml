name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python tests (core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core
        run: |
          python -m pip install --upgrade pip
          pip install -e . fastapi uvicorn click httpx websockets streamlit pytest pytest-asyncio
      - name: Run tests
        run: pytest --tb=short

  ui-build:
    name: UI build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI deps
        working-directory: ui
        run: npm ci
      - name: Type-check
        working-directory: ui
        run: npx tsc --noEmit
      - name: Build
        working-directory: ui
        run: npm run build
        env:
          MAESTRO_API_URL: http://localhost:8000
