# Directo unified stack — single command to spin up everything
#
#   docker compose up --build
#
# This starts:
#   - directo-api: FastAPI on :8000
#   - directo-ui:  Next.js on :3000
#   - directo-data: shared SQLite volume
#
# All three services share the same source tree (mounted from ../).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - directo-data:/data
    environment:
      - PYTHONUNBUFFERED=1
    # NOTE: --db-dir is a top-level (group) option of `directo.platform.cli` and
    # MUST come before the `server` subcommand. Click otherwise rejects it with
    # "No such option '--db-dir'". See directo/platform/cli.py: build_cli().
    command: python -m directo.platform.cli --db-dir /data server --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"
      interval: 10s
      timeout: 3s
      retries: 5

  ui:
    build:
      context: ./ui
    depends_on:
      api:
        condition: service_healthy
    environment:
      - DIRECTO_API_URL=http://api:8000
      - NEXT_PUBLIC_DIRECTO_API_URL=http://api:8000
      - PORT=3000
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O- http://127.0.0.1:3000/ >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  directo-data:
