# Legacy single-repo Docker compose for the UI. Kept for backwards
# compatibility with setups that started before the root-level
# docker-compose.yml was added. Prefer that file for new setups:
# it is the one wired into ./start-docker.sh, the Makefile, and the
# release pipeline.

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ..:/app
      - directo-data:/data
    environment:
      - PYTHONUNBUFFERED=1
    # NOTE: --db-dir is a top-level (group) option of `directo.platform.cli` and
    # MUST come before the `server` subcommand. Click otherwise rejects it with
    # "No such option '--db-dir'". See directo/platform/cli.py: build_cli().
    command: python -m directo.platform.cli --db-dir /data server --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5

  ui:
    build: .
    depends_on:
      api:
        condition: service_healthy
    environment:
      - DIRECTO_API_URL=http://api:8000
      - NEXT_PUBLIC_DIRECTO_WS_URL=ws://localhost:8000
    ports:
      - "3000:3000"

volumes:
  directo-data:
